<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Panel de administración de elViajero para gestionar los destinos turísticos de Costa Rica.">
    <meta name="keywords" content="viajes, Costa Rica, destinos, administración, turismo">
    <meta name="author" content="elViajero">
    <link rel="stylesheet" href="css/style.css">
    <title>elViajero | Administrar Destinos</title>
</head>

<body>
    <!-- Encabezado -->
    <header class="site-header">
        <div class="container header-content">
            <p class="logo"><strong>el<span>Viajero</span></strong></p>

            <nav class="main-nav" aria-label="Navegación de administración">
                <ul>
                    <li><a href="index.html" id="cerrar-sesion">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- Panel de administración de destinos -->
        <section id="administrar" aria-labelledby="admin-title">
            <div class="container">
                <div class="section-heading">
                    <h1 id="admin-title">Panel de Administración</h1>
                    <p>
                        Gestiona los destinos turísticos disponibles en la plataforma.
                    </p>
                </div>

                <!-- Controles de búsqueda y filtro por categoría -->
                <div class="admin-controls">
                    <div class="control-grupo">
                        <label for="buscar">Buscar destino:</label>
                        <input
                            type="search"
                            id="buscar"
                            placeholder="Buscar por nombre...">
                    </div>
                    <div class="control-grupo">
                        <label for="filtro-categoria">Categoría:</label>
                        <select id="filtro-categoria">
                            <option value="todas">Todas las categorías</option>
                        </select>
                    </div>
                </div>

                <!-- Botón restaurar datos JSON -->
                <div class="admin-acciones-globales">
                    <button type="button" id="btn-restablecer" class="btn-restablecer">
                        Restablecer destinos originales del JSON
                    </button>
                </div>

                <div class="events-grid" id="events-grid" aria-live="polite" aria-busy="true">
                    <p>Cargando destinos...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>
                <small>&copy; 2026 elViajero. Todos los derechos reservados.</small>
            </p>
        </div>
    </footer>

    <script src="js/destinos.js"></script>
</body>

</html>
